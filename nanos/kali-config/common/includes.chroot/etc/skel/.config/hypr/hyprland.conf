# NanOs live session — Hyprland 0.56.x style config (read by current Kali Rolling).
# Intentionally conservative for VirtualBox VMSVGA with 3D acceleration.

monitor = , preferred, auto, 1

$mainMod = SUPER
$terminal = foot
$menu = wofi --show drun

env = XCURSOR_SIZE,24
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = waybar
exec-once = mako
exec-once = swaybg -c '#111827'
exec-once = nm-applet --indicator

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(62b6cbff)
    col.inactive_border = rgba(526070aa)
    layout = dwindle
}

decoration {
    rounding = 6
    shadow {
        enabled = false
    }
    blur {
        enabled = false
    }
}

animations {
    enabled = false
}

input {
    kb_layout = us,ru
    follow_mouse = 1
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, F, togglefloating,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
