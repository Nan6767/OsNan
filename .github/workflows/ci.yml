name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Validate NanOs live-build inputs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static configuration checks
        run: python scripts/check-nanos-config.py

      - name: Shell syntax
        run: bash -n scripts/build-kali-iso.sh

      - name: Whitespace and patch checks
        run: git diff --check
