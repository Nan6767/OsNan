name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Проверка дерева (check + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Зависимости для проверок
        run: python -m pip install --upgrade pip pyyaml

      - name: packages.x86_64 актуален
        run: |
          python scripts/gen-packages.py
          python scripts/gen-packages.py --check

      - name: make check
        run: python scripts/check.py

      - name: make test
        run: python -m unittest discover -s scripts/tests -v
