name: Publish ISO

# Публикует уже собранный ISO из артефактов запуска Build ISO в релиз GitHub.
# Нужно, когда сборка прошла, а публикация внутри iso.yml не удалась:
# пересобирать образ заново (40+ минут) ради этого не требуется.
#
# Запуск: правка файла PUBLISH_ISO.txt (run_id, artifact, tag, profile) + push.
# Логи Actions извне недоступны, поэтому результат дублируется аннотациями.
on:
  push:
    paths:
      - "PUBLISH_ISO.txt"

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Параметры публикации
        id: cfg
        run: |
          for key in run_id artifact tag profile; do
            value=$(grep -oE "^$key=[^ ]+" PUBLISH_ISO.txt | head -1 | cut -d= -f2-)
            echo "$key=$value" >> "$GITHUB_OUTPUT"
            echo "$key=$value"
          done

      - name: Очистка диска раннера
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/share/swift /usr/local/share/boost /usr/share/gradle
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune -a -f || true
          df -h /

      - name: Скачивание артефакта сборки
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.cfg.outputs.artifact }}
          run-id: ${{ steps.cfg.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: out

      - name: Публикация в релиз
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.cfg.outputs.tag }}
          PROFILE_NAME: ${{ steps.cfg.outputs.profile }}
          SRC_RUN: ${{ steps.cfg.outputs.run_id }}
        run: |
          ls -lh out/
          iso=$(ls -1 out/*.iso | head -1)
          base=$(basename "$iso")
          size=$(stat -c %s "$iso")
          sum=$(cut -d' ' -f1 < "$iso.sha256")
          echo "::error::PUBLISH_ISO=$base size=$((size/1048576))MB sha256=$sum"
          df -h / | tail -1

          # Лимит GitHub Release — 2 GiB на файл. Влезает — грузим цельным
          # файлом, нет — режем на части по 1500 МБ.
          limit=$((2047 * 1024 * 1024))
          parts=()
          if [ "$size" -le "$limit" ]; then
            echo "::error::PUBLISH_WHOLE_FILE=да ($((size/1048576)) МБ одним файлом)"
            parts=("$iso")
          else
            split -b 1500M -d -a 2 "$iso" "out/$base.part"
            { echo "FlyArchOs ISO разбит на части (лимит GitHub — 2 ГБ на файл релиза)."
              echo
              echo "Собрать образ (Linux/macOS):"
              echo "  cat $base.part* > $base"
              echo "  sha256sum -c $base.sha256"
              echo
              echo "Windows (cmd):"
              echo "  copy /b $base.part* $base"; } > out/JOIN-README.txt
            shopt -s nullglob
            parts=(out/"$base".part*)
            shopt -u nullglob
            parts+=(out/JOIN-README.txt)
          fi
          parts+=("$iso.sha256")
          echo "::error::PUBLISH_PARTS=${#parts[@]}"
          ls -lh out/

          notes="Автоматическая сборка FlyArchOs: Arch Linux + Hyprland + KDE Plasma, установщик Calamares, несколько обоев.

          Профиль: **$PROFILE_NAME** ($((size/1048576)) МБ)
          Сборка: https://github.com/${GH_REPO}/actions/runs/${SRC_RUN}
          Контрольная сумма: \`$sum\`

          Если образ больше 2 ГБ, он нарезан на части по 1500 МБ (лимит GitHub
          на файл релиза) — как собрать обратно, написано в JOIN-README.txt.
          Целый ISO одним файлом также лежит в артефактах запуска сборки."

          start=$(date +%s)
          if gh release view "$TAG" >/dev/null 2>&1; then
            rc=0
            gh release upload "$TAG" "${parts[@]}" --clobber > release.log 2>&1 || rc=$?
          else
            rc=0
            gh release create "$TAG" \
              --title "FlyArchOs ISO — $PROFILE_NAME (сборка $SRC_RUN)" \
              --notes "$notes" \
              "${parts[@]}" > release.log 2>&1 || rc=$?
          fi
          tail -5 release.log
          if [ "$rc" -eq 0 ]; then
            echo "::error::RELEASE_OK=$TAG частей=${#parts[@]} за $(( $(date +%s) - start )) сек"
          else
            echo "::error::RELEASE_FAILED rc=$rc $(tail -4 release.log | tr '\n' '~' | sed 's/%/%25/g; s/::/../g' | cut -c1-700)"
            exit 1
          fi
