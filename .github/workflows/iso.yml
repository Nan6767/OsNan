name: Build NanOs ISO

on:
  # Explicit file trigger keeps routine edits from starting a multi-hour image build.
  push:
    paths:
      - "BUILD_ISO.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nanos-iso-${{ github.ref }}
  cancel-in-progress: false

jobs:
  iso:
    name: Kali live-build (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Free space on the GitHub runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/share/swift /usr/local/share/boost /usr/share/gradle || true
          sudo docker system prune -af || true
          df -h /

      - name: Build live ISO in a privileged Kali Rolling container
        run: |
          docker run --rm --privileged --security-opt apparmor=unconfined \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            kalilinux/kali-rolling:latest \
            bash -euc '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update
              apt-get install -y \
                ca-certificates git live-build cdebootstrap curl sudo python3
              ./scripts/build-kali-iso.sh
            '

      - name: Verify output checksum
        if: success()
        run: |
          cat out/build-manifest.txt
          (cd out && sha256sum -c nanos-*.iso.sha256)
          ls -lh out/nanos-*.iso out/nanos-*.iso.sha256

      - name: Upload NanOs ISO candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: nanos-0.0.1-alpha-${{ github.run_number }}
          path: |
            out/nanos-*.iso
            out/nanos-*.iso.sha256
            out/build-manifest.txt
            out/kali-live.log
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Surface the build failure context
        if: failure()
        shell: bash
        run: |
          if [[ -s out/kali-live.log ]]; then
            tail -n 60 out/kali-live.log
            tailmsg=$(tail -n 35 out/kali-live.log | sed -r 's/\x1b\[[0-9;]*m//g' \
              | tr '\n' '~' | sed 's/%/%25/g; s/::/%3A%3A/g; s/\r/%0D/g' | cut -c1-3500)
            echo "::error title=NanOs build log tail::${tailmsg}"
          else
            echo "::error title=NanOs build failure::No build log was created; failure happened during container startup or dependency installation."
          fi

      - name: Preserve build log when build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nanos-0.0.1-alpha-build-log-${{ github.run_number }}
          path: out/kali-live.log
          if-no-files-found: ignore
          retention-days: 30
