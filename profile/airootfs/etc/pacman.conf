# FlyArchOs — системная конфигурация pacman установленной системы.
# Важно: multilib включён явно (в системе есть lib32-пакеты), а сборочных
# вещей здесь быть не должно: ни локального file://-репозитория CI,
# ни mini-NoExtract (они живут только в profile/pacman.conf.in сборки).

[options]
HoldPkg      = pacman glibc
Architecture = auto
CheckSpace
SigLevel     = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 8

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# 32-битные библиотеки (Steam, Wine, драйверы)
[multilib]
Include = /etc/pacman.d/mirrorlist
