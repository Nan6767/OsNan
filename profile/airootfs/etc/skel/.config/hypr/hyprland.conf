# ---------------------------------------------------------------------------
# FlyArchOs — конфигурация Hyprland
# Документация: https://wiki.hyprland.org/Configuring/
# ---------------------------------------------------------------------------

$mainMod    = SUPER
$terminal   = kitty
$menu       = wofi --show drun
$browser    = firefox
$files      = thunar
$wallpaper  = /usr/share/backgrounds/flyarchos/default.jpg

# ------------------------------- автозапуск -------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = swww-daemon
exec-once = swww img $wallpaper --transition-type wipe
exec-once = waybar
exec-once = mako
exec-once = hypridle
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = flyarchos-welcome --autostart

# ------------------------------- мониторы ---------------------------------
monitor = ,preferred,auto,1
# раскомментируйте, если нужен свой вариант (например 2K@144):
# monitor = DP-1, 2560x1440@144, 0x0, 1

# ------------------------------- ввод -------------------------------------
input {
    kb_layout = us,ru
    kb_variant =
    kb_options = grp:alt_shift_toggle,compose:ralt
    kb_model =
    repeat_rate = 35
    repeat_delay = 300
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        disable_while_typing = true
        tap-to-click = true
        drag_lock = true
    }
}

# ------------------------------- внешний вид ------------------------------
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border   = rgba(22d3eeff) rgba(f0559bff) 45deg
    col.inactive_border = rgba(24242faa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

decoration {
    rounding = 12
    active_opacity = 1.0
    inactive_opacity = 0.94
    blur {
        enabled = true
        size = 6
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }
    drop_shadow = true
    shadow_range = 14
    shadow_render_power = 3
    col.shadow = rgba(08080faa)
}

animations {
    enabled = yes
    bezier = fly, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, fly, slide
    animation = windowsIn, 1, 5, fly, popin 80%
    animation = windowsOut, 1, 4, default, popin 80%
    animation = border, 1, 10, default
    animation = fade, 1, 6, default
    animation = workspaces, 1, 5, fly, slidevert
}

dwindle {
    pseudotile = yes
    preserve_split = true
    no_gaps_when_only = false
}

master {
    new_status = master
    new_on_top = true
}

gestures {
    workspace_swipe = true
    workspace_swipe_fingers = 3
}

misc {
    disable_hyprland_logo = false
    disable_splash_rendering = true
    vfr = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ------------------------------- правила окон -----------------------------
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, title:^(Открыть файл|Open File|Save As|Save a File)$
windowrulev2 = float, class:^(org.kde.kcalc)$
windowrulev2 = center, class:^(pavucontrol|blueman-manager)$
windowrulev2 = opacity 0.96 0.92, class:^(kitty|foot|org.kde.konsole)$
windowrulev2 = noblur, class:^( Anyrun|wofi)$
windowrulev2 = suppressevent maximize, class:.*   # полный экран без «шапки»

# ------------------------------- клавиши ----------------------------------
# приложения
bind = $mainMod, Return, exec, $terminal
bind = $mainMod, D,      exec, $menu
bind = $mainMod, B,      exec, $browser
bind = $mainMod, E,      exec, $files
bind = $mainMod, T,      exec, kitty --hold flyarchos-info
bind = $mainMod, L,      exec, hyprlock
bind = $mainMod, W,      exec, flyarchos-wallpaper random
bind = $mainMod, P,      exec, grim -g "$(slurp)" - | wl-copy -t image/png

# окна
bind = $mainMod, Q,          killactive,
bind = $mainMod SHIFT, Q,    exit,
bind = $mainMod, V,          togglefloating,
bind = $mainMod, F,          fullscreen,
bind = $mainMod, S,          togglesplit,        # dwindle
bind = $mainMod, J,          cyclenext,
bind = $mainMod, G,          togglegroup,
bind = $mainMod, Tab,        changegroupactive, f
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up,   workspace, e-1

# перемещение фокуса
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# рабочие столы
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, bracketright, workspace, e+1
bind = $mainMod, bracketleft,  workspace, e-1

# скриншоты
bind = , Print,          exec, grim - | wl-copy -t image/png && notify-send "Скриншот" "Скопирован в буфер обмена"
bind = $mainMod, Print,  exec, grim -g "$(slurp)" - | wl-copy -t image/png && notify-send "Скриншот" "Область скопирована"

# звук, яркость, плеер
bindel = , XF86AudioRaiseVolume, exec, pamixer -i 5 && pactl set-sink-volume @DEFAULT_SINK@ +5%
bindel = , XF86AudioLowerVolume, exec, pamixer -d 5
bindel = , XF86AudioMute,        exec, pamixer -t
bindel = , XF86AudioPlay,        exec, playerctl play-pause
bindel = , XF86AudioNext,        exec, playerctl next
bindel = , XF86AudioPrev,        exec, playerctl previous
bindel = , XF86MonBrightnessUp,   exec, brightnessctl set +5%
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# изменение размера плавающих окон мышью
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
bindm = $mainMod ALT, mouse:272, resizewindow
