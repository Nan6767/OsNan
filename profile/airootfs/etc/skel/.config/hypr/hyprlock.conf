# FlyArchOs — экран блокировки Hyprland (hyprlock).
# Файл пересоздаётся утилитой flyarchos-wallpaper при смене обоев:
# вместо /usr/share/backgrounds/flyarchos/default.jpg подставляется путь к текущей картинке.

general {
    disable_loading_bar = true
    grace = 3
    hide_cursor = true
    no_fade_in = false
}

background {
    monitor =
    path = /usr/share/backgrounds/flyarchos/default.jpg
    blur_passes = 3
    blur_size = 8
    contrast = 0.95
    brightness = 0.72
    vibrancy = 0.18
    vibrancy_darkness = 0.15
}

input-field {
    monitor =
    size = 340, 56
    outline_thickness = 2
    dots_size = 0.28
    dots_spacing = 0.22
    dots_center = true
    dots_rounding = -1
    outer_color = rgba(10, 12, 24, 0.85)
    inner_color = rgba(27, 29, 43, 0.9)
    font_color = rgb(231, 233, 240)
    fade_on_empty = true
    fade_timeout = 2000
    rounding = 14
    check_color = rgb(34, 211, 238)
    fail_color = rgb(240, 85, 109)
    fail_text = Неверный пароль
    position = 0, -140
    halign = center
    valign = center
    placeholder_text = Пароль
    hide_input = false
}

label {
    monitor =
    text = FlyArchOs
    color = rgb(245, 247, 255)
    font_size = 30
    font_family = JetBrainsMono Nerd Font
    position = 0, -240
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(231, 233, 240)
    font_size = 64
    font_family = JetBrainsMono Nerd Font
    position = 0, -380
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgb(154, 160, 180)
    font_size = 16
    position = 0, -320
    halign = center
    valign = center
}

label {
    monitor =
    text = Введите пароль, чтобы продолжить
    color = rgb(154, 160, 180)
    font_size = 14
    position = 0, -70
    halign = center
    valign = center
}
