---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    # «Жирный» образ: на диск переезжает вся live-система (~20 ГБ)
    requiredStorage: 24.0
    requiredRam: 4.0
    # Проверка интернета отключена: установка полностью офлайн.
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"
    url: ""
    selector: ""
