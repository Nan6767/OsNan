---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
    # «Жирный» образ: на диск переезжает вся live-система (~20 ГБ).
    # Для профиля mini (установленная система ~5,5 ГБ) build-iso.sh
    # снижает порог до 16.0 прямо при сборке — здесь остаётся значение
    # для full/slim. Диск ровно на границе порога Calamares пропускает
    # впритык (>=), поэтому запас важен.
    requiredStorage: 24.0
    requiredRam: 4.0
    # Проверка интернета отключена: установка полностью офлайн.
    # Проверки screen нет: на стандартном окне VirtualBox (1024x768)
    # она даёт жёлтое предупреждение «экран слишком маленький», хотя
    # окно установщика помещается — лишний шум перед первой установкой.
    check:
        - storage
        - ram
        - power
        - root
    required:
        - storage
        - ram
        - root

geoip:
    style: "none"
    url: ""
    selector: ""
