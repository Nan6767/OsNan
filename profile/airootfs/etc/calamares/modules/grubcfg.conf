---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet", "zswap.enabled=0" ]
always_use_defaults: true
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_SAVEDEFAULT: true
    GRUB_DISABLE_SUBMENU: true
    GRUB_DISABLE_RECOVERY: true
    # Страница выбора обещает поиск других ОС; без явного false современный
    # grub-mkconfig os-prober не запускает.
    GRUB_DISABLE_OS_PROBER: false
    GRUB_GFXMODE: "1920x1080,auto"
    GRUB_GFXPAYLOAD_LINUX: "keep"
    GRUB_TERMINAL_OUTPUT: "gfxterm"
    GRUB_BACKGROUND: "/usr/share/backgrounds/flyarchos/default.jpg"
    GRUB_COLOR_NORMAL: "cyan/black"
    GRUB_COLOR_HIGHLIGHT: "white/magenta"
