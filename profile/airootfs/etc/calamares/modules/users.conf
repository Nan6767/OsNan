---
# Пользователь FlyArchOs: zsh, вход в wheel, root-пароль задаётся отдельно.
user:
    shell: /usr/bin/zsh
    forbidden_names: [ root, fly ]
    home_permissions: "o700"

defaultGroups:
    - name: wheel
      must_exist: true
      system: true
    - name: users
      must_exist: true
      system: true
    - audio
    - video
    - lp
    - network
    - optical
    - storage
    - scanner
    - input
    # Общие папки VirtualBox в установленной гостевой системе.
    - name: vboxsf
      must_exist: false
      system: true

sudoersGroup: wheel
sudoersConfigureWithGroup: false
autologinGroup: autologin
setRootPassword: true
doReusePassword: false
displayAutologin: false
doAutologin: false

passwordRequirements:
    minLength: 4
    maxLength: -1
allowWeakPasswords: true
allowWeakPasswordsDefault: false

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "flyarchos"
    forbidden_names: [ localhost ]
