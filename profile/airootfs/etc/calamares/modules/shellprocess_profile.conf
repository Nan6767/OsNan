---
# Применяем выбор окружения и наборов ПО: удаляем пакеты
# невыбранных групп (см. /usr/share/flyarchos/groups/*.txt).
#
# ${gs[packagechooser_desktop]} и ${gs[packagechooser_extras]} подставляет
# сам Calamares — это строки вида "hyprland" и "dev,gaming".
dontChroot: false
timeout: 1800
verbose: true
script:
    - command: "flyarchos-profile --apply --desktop=${gs[packagechooser_desktop]} --preset=${gs[packagechooser_preset]} --extras=${gs[packagechooser_extras]} --remove-live"
