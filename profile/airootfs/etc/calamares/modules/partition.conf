---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

# По умолчанию предлагаем всё стереть и поставить btrfs.
initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"

# Раздел/файл подкачки выбирается пользователем.
userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: file

luksGeneration: luks2
drawNestedPartitions: false
alwaysShowPartitionLabels: true

# Не трогаем носитель, с которого загружен live-образ:
essentialMounts: [ "live-*", "control", "ventoy" ]

lvm:
    enable: true
