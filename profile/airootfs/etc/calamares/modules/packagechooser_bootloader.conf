---
# Выбор загрузчика. systemd-boot работает только на UEFI-системах:
# если выбран он, а машина загружена в BIOS-режиме, скрипт
# /usr/lib/flyarchos/install-finalize.sh поставит GRUB автоматически.
mode: required
method: legacy          # пишет GS-ключ packagechooser_bootloader

labels:
    step: "Загрузчик"
    step[ru]: "Загрузчик"

default: "grub"

items:
    - id: "grub"
      name: "GRUB (универсально)"
      name[ru]: "GRUB (универсально)"
      description: "Работает и на BIOS, и на UEFI, находит другие ОС (os-prober), тема FlyArchOs."
      description[ru]: "Работает и на BIOS, и на UEFI, находит другие ОС, оформление FlyArchOs."
      screenshot: "/usr/share/backgrounds/flyarchos/05-nord-fjord.jpg"
    - id: "systemd-boot"
      name: "systemd-boot (только UEFI)"
      name[ru]: "systemd-boot (только UEFI)"
      description: "Минималистичный загрузчик от systemd. Требует UEFI; на BIOS-системах будет заменён на GRUB."
      description[ru]: "Минималистичный загрузчик от systemd. Требует UEFI; на BIOS-системах будет заменён на GRUB."
      screenshot: "/usr/share/backgrounds/flyarchos/06-glass-prism.jpg"
