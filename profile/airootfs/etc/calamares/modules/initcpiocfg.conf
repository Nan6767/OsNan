---
# Конфигурация mkinitcpio под железо целевой машины (в т.ч. LUKS).
# Источник — /etc/mkinitcpio.conf, который подготовил install-prepare.sh.
useSystemdHook: false
source: "/etc/mkinitcpio.conf"
# Хука 'btrfs' в современном mkinitcpio нет: поддержку btrfs дают
# хук filesystems и MODULES=(btrfs) из /etc/mkinitcpio.conf.d/00-flyarchos.conf.
hooks:
    prepend: []
    append: []
    remove: []
