---
# Сценарий установки одним кликом. Пресет задаёт базовые наборы ПО;
# отмеченные на следующем шаге («Наборы ПО») добавляются сверху.
# Соответствие пресетов наборам описано в flyarchos-profile (PRESETS),
# расхождение ловит юнит-тест.
mode: required
method: legacy          # пишет GS-ключ packagechooser_preset

labels:
    step: "Сценарий установки"
    step[ru]: "Сценарий установки"

default: "custom"

items:
    - id: "custom"
      name: "Свой выбор вручную"
      name[ru]: "Свой выбор вручную"
      description: "Без пресета: на следующем шаге сами отметьте нужные наборы ПО."
      description[ru]: "Без пресета: на следующем шаге сами отметьте нужные наборы ПО."
      screenshot: "/usr/share/backgrounds/flyarchos/01-aurora-nexus.jpg"
    - id: "gaming"
      name: "Игровой ПК"
      name[ru]: "Игровой ПК"
      description: "Наборы «Игры» + «Мультимедиа»: Steam, Lutris, Wine для программ .exe, OBS и медиаинструменты. На следующем шаге можно добавить ещё."
      description[ru]: "Наборы «Игры» + «Мультимедиа»: Steam, Lutris, Wine для программ .exe, OBS и медиаинструменты. На следующем шаге можно добавить ещё."
      screenshot: "/usr/share/backgrounds/flyarchos/02-neon-grid.jpg"
    - id: "workstation"
      name: "Рабочая станция"
      name[ru]: "Рабочая станция"
      description: "Наборы «Разработка» + «Офис» + «Мультимедиа»: компиляторы и IDE, LibreOffice, Thunderbird, редакторы медиа. На следующем шаге можно добавить ещё."
      description[ru]: "Наборы «Разработка» + «Офис» + «Мультимедиа»: компиляторы и IDE, LibreOffice, Thunderbird, редакторы медиа. На следующем шаге можно добавить ещё."
      screenshot: "/usr/share/backgrounds/flyarchos/05-nord-fjord.jpg"
    - id: "privacy"
      name: "Приватность"
      name[ru]: "Приватность"
      description: "Набор «Приватность и безопасность»: Tor Browser, OnionShare, VeraCrypt, очистка метаданных, Firejail; файрвол UFW включится автоматически. На следующем шаге можно добавить ещё."
      description[ru]: "Набор «Приватность и безопасность»: Tor Browser, OnionShare, VeraCrypt, очистка метаданных, Firejail; файрвол UFW включится автоматически. На следующем шаге можно добавить ещё."
      screenshot: "/usr/share/backgrounds/flyarchos/08-nebula.jpg"
    - id: "full"
      name: "Всё сразу"
      name[ru]: "Всё сразу"
      description: "Все наборы ПО: разработка, игры, мультимедиа, офис и приватность. Дольше ставится и занимает больше места, зато ничего не пропущено."
      description[ru]: "Все наборы ПО: разработка, игры, мультимедиа, офис и приватность. Дольше ставится и занимает больше места, зато ничего не пропущено."
      screenshot: "/usr/share/backgrounds/flyarchos/06-glass-prism.jpg"
