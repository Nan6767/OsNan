---
# Распаковка live-системы (squashfs с ISO) на целевой диск.
# Исключаем то, что имеет смысл только в live: явно служебные каталоги,
# кэш пакетов и логи — они всё равно пересоздаются при загрузке.
unpack:
    - source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
      weight: 100
      exclude:
          - "var/cache/pacman/pkg/*"
          - "var/log/*"
          - "tmp/*"
          - "run/*"
          - "proc/*"
          - "sys/*"
          - "dev/*"
