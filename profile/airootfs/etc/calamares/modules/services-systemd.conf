---
units:
    - name: "NetworkManager.service"
      action: "enable"
    - name: "sddm.service"
      action: "enable"
    - name: "bluetooth.service"
      action: "enable"
    - name: "cups.service"
      action: "enable"
      mandatory: false
    - name: "avahi-daemon.service"
      action: "enable"
      mandatory: false
    - name: "systemd-timesyncd.service"
      action: "enable"
    # Вне Oracle VM служба сама пропускается по ConditionVirtualization.
    - name: "vboxservice.service"
      action: "enable"
      mandatory: false
    - name: "pacman-init.service"
      action: "disable"
      mandatory: false
    - name: "choose-mirror.service"
      action: "disable"
      mandatory: false
