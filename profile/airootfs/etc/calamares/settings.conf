# ---------------------------------------------------------------------------
# FlyArchOs — конфигурация установщика Calamares.
#
# Схема установки (ISO «жирный», всё внутри squashfs):
#   1. пользователь выбирает окружение, наборы софта и загрузчик;
#   2. partition  — разметка диска (btrfs/ext4/xfs, опционально LUKS);
#   3. unpackfs   — распаковка live-системы на диск (без сети!);
#   4. shellprocess@prepare  — чистка live-мусора, mkinitcpio-пресеты;
#   5. shellprocess@profile  — удаление пакетов невыбранных групп;
#   6. users/fstab/initcpio/grubcfg/bootloader — добивка системы;
#   7. shellprocess@finalize — тема GRUB, сессия SDDM, обои, проверки.
# ---------------------------------------------------------------------------
---

modules-search: [ local ]

# Несколько экземпляров одних и тех же модулей с разной конфигурацией.
instances:
    - id: "desktop"
      module: "packagechooser"
      config: "packagechooser_desktop.conf"
    - id: "preset"
      module: "packagechooser"
      config: "packagechooser_preset.conf"
    - id: "extras"
      module: "packagechooser"
      config: "packagechooser_extras.conf"
    - id: "bootloader"
      module: "packagechooser"
      config: "packagechooser_bootloader.conf"
    - id: "prepare"
      module: "shellprocess"
      config: "shellprocess_prepare.conf"
    - id: "profile"
      module: "shellprocess"
      config: "shellprocess_profile.conf"
    - id: "finalize"
      module: "shellprocess"
      config: "shellprocess_finalize.conf"

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - packagechooser@desktop
        - packagechooser@preset
        - packagechooser@extras
        - packagechooser@bootloader
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - shellprocess@prepare
        - machineid
        - fstab
        - locale
        - localecfg
        - keyboard
        - hostinfo
        - networkcfg
        - initcpiocfg
        - shellprocess@profile
        - hwclock
        - services-systemd
        - users
        - displaymanager
        - initcpio
        - grubcfg
        - bootloader
        - shellprocess@finalize
        - umount
    - show:
        - finished

branding: flyarchos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false
