# Хуки initramfs для LIVE-загрузки с ISO — как в официальном releng,
# только без PXE (сетевая загрузка FlyArchOs не нужна).
#
# БЕЗ хука archiso initramfs не монтирует корневую систему с носителя,
# и загрузка падает на «Failed to start Switch Root» (так было во всех
# образах до 1.7.0-бета включительно — дефект нашли при первом же
# реальном запуске в VirtualBox).
#
# Сами хуки поставляет пакет mkinitcpio-archiso (группа 99-live).
# Установщик убирает этот файл с целевой системы (install-prepare.sh),
# иначе archiso-хуки попали бы в initramfs установленной системы.
# От releng отрезаны kms, memdisk и microcode — снова из-за лимита 2 ГиБ:
# kms тащит в initramfs прошивки GPU (~100 МБ), а микрокод загрузчик
# подгружает отдельным initrd, как это делалось годами. Видеодрайвер
# в live поднимется чуть позже при старте systemd — на работу не влияет.
HOOKS=(base udev modconf archiso archiso_loop_mnt block filesystems keyboard)

# Сжатие initramfs — xz на максимуме (как в releng): zstd даёт файл
# заметно больше. Файл 00-flyarchos.conf читается раньше и не мешает.
COMPRESSION="xz"
COMPRESSION_OPTIONS=(-9e)
