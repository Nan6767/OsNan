# Настройки mkinitcpio для установленной системы FlyArchOs.
# Хуки для установленной системы пишет установщик (Calamares initcpiocfg,
# с учётом LUKS). Хуки LIVE-загрузки с ISO лежат рядом, в archiso.conf, —
# без них образ не загружается. Здесь только сжатие и модули.
MODULES=(btrfs)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3 -T0)
