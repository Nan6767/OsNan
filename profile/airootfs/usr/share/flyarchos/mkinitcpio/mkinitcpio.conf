# /etc/mkinitcpio.conf — вариант по умолчанию для установленной системы.
# Раскладывается скриптом flyarchos-prepare поверх archiso-конфигурации.
MODULES=(btrfs)
BINARIES=()
FILES=()
HOOKS=(base udev autodetect microcode modconf kms keyboard keymap consolefont block filesystems fsck)
COMPRESSION="zstd"
COMPRESSION_OPTIONS=(-3 -T0)
